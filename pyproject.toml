[project]
name = "yolo-kalman"
version = "0.1.0"
description = "Native YOLO + GPU Kalman multi-object tracker with occlusion-robust ids (BYTE + OC-SORT + re-ID)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "torchvision",
    "numpy",
    "scipy",
    "lap",
    "opencv-python-headless",
    "ultralytics",
    "nvidia-ml-py",
    "pynvvideocodec>=2.2.4",
    "tensorrt-cu13>=11.5.0.63",
    "ninja>=1.13.2",
    "motmetrics>=1.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
